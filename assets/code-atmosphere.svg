<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" fill="none">
  <defs>
    <linearGradient id="panel" x1="190" y1="85" x2="835" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10263A" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0A1A2A" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="edge" x1="150" y1="120" x2="880" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FB0C8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3FB0C8" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#A9C0CC" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <path d="M490 0V760M0 380H980" stroke="#3FB0C8" stroke-opacity=".12"/>
  <circle cx="490" cy="380" r="315" stroke="#3FB0C8" stroke-opacity=".16"/>
  <circle cx="490" cy="380" r="270" stroke="#3FB0C8" stroke-opacity=".1" stroke-dasharray="2 9"/>
  <g transform="rotate(-5 535 380)">
    <rect x="146" y="108" width="710" height="526" rx="8" fill="url(#panel)" stroke="url(#edge)"/>
    <rect x="147" y="109" width="708" height="524" rx="8" fill="url(#grid)"/>
    <path d="M147 153H855" stroke="#A9C0CC" stroke-opacity=".17"/>
    <circle cx="170" cy="131" r="4" fill="#F18A83" fill-opacity=".85"/>
    <circle cx="185" cy="131" r="4" fill="#EAC57C" fill-opacity=".8"/>
    <circle cx="200" cy="131" r="4" fill="#79C7A2" fill-opacity=".8"/>
    <text x="222" y="136" fill="#B9CCD6" fill-opacity=".72" font-family="Consolas,monospace" font-size="11">atelier / interface.css</text>
    <text x="785" y="136" fill="#3FB0C8" fill-opacity=".72" font-family="Consolas,monospace" font-size="10">CSS</text>
    <g font-family="Consolas,monospace" font-size="13">
      <g fill="#8DA5B3" fill-opacity=".48" text-anchor="end">
        <text x="180" y="190">01</text><text x="180" y="224">02</text><text x="180" y="258">03</text>
        <text x="180" y="292">04</text><text x="180" y="326">05</text><text x="180" y="360">06</text>
        <text x="180" y="394">07</text><text x="180" y="428">08</text><text x="180" y="462">09</text>
        <text x="180" y="496">10</text><text x="180" y="530">11</text><text x="180" y="564">12</text>
        <text x="180" y="598">13</text>
      </g>
      <text x="204" y="190" fill="#8ED5E2" fill-opacity=".9">.interface {</text>
      <text x="230" y="224" fill="#B7C9D3" fill-opacity=".76">display: grid;</text>
      <text x="230" y="258" fill="#B7C9D3" fill-opacity=".76">grid-template-columns: 1fr 1fr;</text>
      <text x="230" y="292" fill="#B7C9D3" fill-opacity=".76">gap: clamp(1rem, 3vw, 2rem);</text>
      <text x="204" y="326" fill="#8ED5E2" fill-opacity=".9">}</text>
      <text x="204" y="394" fill="#E3BF80" fill-opacity=".88">@media (max-width: 48rem) {</text>
      <text x="230" y="428" fill="#B7C9D3" fill-opacity=".76">.interface {</text>
      <text x="256" y="462" fill="#B7C9D3" fill-opacity=".76">grid-template-columns: 1fr;</text>
      <text x="256" y="496" fill="#B7C9D3" fill-opacity=".76">padding-inline: 1.25rem;</text>
      <text x="230" y="530" fill="#B7C9D3" fill-opacity=".76">}</text>
      <text x="204" y="564" fill="#E3BF80" fill-opacity=".88">}</text>
      <text x="204" y="598" fill="#8ED5E2" fill-opacity=".9">/* une mise en page, deux rythmes */</text>
    </g>
    <path d="M662 678h130" stroke="#3FB0C8" stroke-opacity=".35"/>
    <circle cx="811" cy="678" r="3" fill="#3FB0C8"/>
